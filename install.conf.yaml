- defaults:
    link:
      relink: true

- clean: ['~']

- link:
    ~/.gitconfig: .gitconfig
    ~/.zshrc: .zshrc
    ~/.config/niri: niri
    ~/.config/ghostty: ghostty

- omnipkg:
    - install: [
        helium-browser-bin,
        zed,
        mise,
        sbctl,
        ghostty]

- shell:
  - [git submodule update --init --recursive, Installing submodules]
