- defaults:
    link:
      relink: true

- clean: ['~']

- link:
    ~/.gitconfig: .gitconfig
    ~/.zshrc: .zshrc
    ~/.config/starship.toml: starship.toml
    ~/.config/niri: niri
    ~/.config/ghostty: ghostty
    ~/.config/zed: zed

- omnipkg:
    - install: [
        helium-browser-bin,
        zed,
        mise,
        sbctl,
        starship,
        cloudflare-warp-bin,
        ghostty]

- shell:
  - [git submodule update --init --recursive, Installing submodules]
