- defaults:
    link:
      relink: true

- clean: ['~']

- link:
    ~/.gitconfig: .gitconfig
    ~/.config/niri: niri

- omnipkg:
    - install: [
        helium-browser-bin,
        zed,
        mise,
        ghostty]

- shell:
  - [git submodule update --init --recursive, Installing submodules]
